<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Training Registration</title>
</head>

<body>

<h1>Training Event Registration</h1>

<form th:action="@{/register}"
      th:object="${registration}"
      method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}">
    <p th:errors="*{name}"></p>

    <br>

    <label>Email:</label>
    <input type="text" th:field="*{email}">
    <p th:errors="*{email}"></p>

    <br>

    <label>Address:</label>
    <input type="text" th:field="*{address}">
    <p th:errors="*{address}"></p>

    <br>

    <button type="submit">Register</button>

</form>

</body>
</html>
