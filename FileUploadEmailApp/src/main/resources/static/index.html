<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
</head>

<body>

<h2>Upload a File</h2>

<form action="/upload"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="file"
           required>

    <br><br>

    <button type="submit">
        Upload File
    </button>

</form>

</body>
</html>
