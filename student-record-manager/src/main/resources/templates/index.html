<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Record Manager</title>
    <!-- Bootstrap CSS for styling -->
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="container mt-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Student Records System</h2>
        <a th:href="@{/students/new}" class="btn btn-success">Add New Student</a>
    </div>

    <!-- Search Bar Section -->
    <div class="card mb-4 bg-light">
        <div class="card-body">
            <form th:action="@{/students}" method="get" class="row g-3 align-items-center">
                <div class="col-md-6">
                    <input type="text" name="search" class="form-control" placeholder="Search student by name..." th:value="${search}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/students}" class="btn btn-secondary">Clear Filter</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Student Records Table -->
    <table class="table table-striped table-hover table-bordered shadow-sm">
        <thead class="table-dark">
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 40%;">Name</th>
                <th style="width: 20%;">Class</th>
                <th style="width: 15%;">Age</th>
                <th style="width: 15%;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through the student list sent from Controller -->
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}" class="fw-bold"></td>
                <td th:text="${student.studentClass}"></td>
                <td th:text="${student.age}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-warning me-2">Edit</a>
                        <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-sm btn-danger" 
                           onclick="return confirm('Are you sure you want to delete this student record?');">Delete</a>
                    </div>
                </td>
            </tr>
            <!-- Displayed when no students are available -->
            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="5" class="text-center text-muted py-4">No student records found.</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
