<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Student Details</title>
    <!-- Bootstrap CSS for styling -->
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <!-- Heading changes dynamically based on whether ID exists (Edit) or not (Add) -->
                    <h4 class="mb-0" th:text="${student.id != null} ? 'Edit Student Details' : 'Add New Student'"></h4>
                </div>
                <div class="card-body">
                    
                    <form th:action="@{/students/save}" th:object="${student}" method="post">
                        
                        <!-- Hidden field to pass ID while editing -->
                        <input type="hidden" th:field="*{id}">
                        
                        <!-- Name Field -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter student's full name" required>
                        </div>
                        
                        <!-- Class Field -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Class</label>
                            <input type="text" th:field="*{studentClass}" class="form-control" placeholder="e.g. Class 10, Grade A" required>
                        </div>
                        
                        <!-- Age Field -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Age</label>
                            <input type="number" th:field="*{age}" class="form-control" placeholder="Enter age" min="1" max="100" required>
                        </div>
                        
                        <!-- Form Buttons -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/students}" class="btn btn-outline-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Save Record</button>
                        </div>
                        
                    </form>
                    
                </div>
            </div>
        </div>
    </div>

</body>
</html>
