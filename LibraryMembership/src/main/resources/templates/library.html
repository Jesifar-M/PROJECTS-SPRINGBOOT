<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Library Membership Registration</title>
</head>

<body>

    <h1>Library Membership Registration</h1>

    <form th:action="@{/register}" th:object="${library}" method="post">

        <label>Name:</label>
        <input type="text" th:field="*{name}" required>
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" th:field="*{dateOfBirth}" required>
        <br><br>

        <label>Address:</label>
        <textarea th:field="*{address}" required></textarea>
        <br><br>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>
        <br><br>

        <label>Password:</label>
        <input type="password" th:field="*{password}" required>
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>

</html>
