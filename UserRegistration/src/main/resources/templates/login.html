<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Login</title>

</head>

<body>

    <h1>Login</h1>

    <p th:if="${message}"
       th:text="${message}">
    </p>

    <p th:if="${error}"
       th:text="${error}">
    </p>

    <form th:action="@{/login}"
          method="post">

        <label>Email:</label>

        <input type="email"
               name="email"
               required>

        <br><br>

        <label>Password:</label>

        <input type="password"
               name="password"
               required>

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <a href="/">
        Create a new account
    </a>

</body>

</html>
